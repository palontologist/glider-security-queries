name: Glider Security Queries CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Queries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate query syntax and structure
        run: python scripts/validate_queries.py
      
      - name: Check query imports
        run: |
          for q in queries/**/*.py; do
            echo "Checking $q..."
            python -c "
import sys
sys.path.insert(0, '.')
exec(open('$q').read())
result = query()
print(f'  OK: {type(result).__name__}')
            "
          done

  test:
    name: Run Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Run tests
        run: forge test -vv
        working-directory: .
      
      - name: Run tests with gas report
        run: forge test --gas-report
        working-directory: .

  glider-scan:
    name: Run Glider Queries
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Glider
        run: |
          pip install --upgrade pip
          pip install glider
      
      - name: Run all queries against examples
        run: |
          mkdir -p glider-results
          python scripts/run_all_queries.py \
            --target ./examples \
            --output ./glider-results \
            --format sarif
        continue-on-error: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: glider-results
          category: glider-security-queries

  query-coverage:
    name: Check Query Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Count queries by category
        run: |
          echo "## Query Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Queries |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          for dir in queries/*/; do
            category=$(basename "$dir")
            count=$(find "$dir" -name "*.py" | wc -l)
            echo "| $category | $count |" >> $GITHUB_STEP_SUMMARY
          done
          total=$(find queries -name "*.py" | wc -l)
          echo "| **Total** | **$total** |" >> $GITHUB_STEP_SUMMARY

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test, glider-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for version tag
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            echo "Tagged release detected"
          else
            echo "No tag - skipping release"
            exit 0
          fi
      
      - name: Generate changelog
        run: |
          echo "## Changes" > CHANGELOG.md
          git log --oneline --since="$(git describe --tags --abbrev=0 2>/dev/null || echo 'HEAD')"..HEAD --grep="query" --grep="feat" --grep="fix" >> CHANGELOG.md || true
          cat CHANGELOG.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          generate_release_notes: true
          files: |
            glider-results/*.sarif
          body_path: CHANGELOG.md